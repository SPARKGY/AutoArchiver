<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoArchiver - Generador de PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>📄 Generador de PDF desde Imagen</h2>
  <p id="info">Por favor, sigue los pasos para generar y enviar tu documento.</p>

  <!-- Paso 1: Seleccionar imágenes -->
  <div class="step">
    <h3>Paso 1: Selecciona imágenes</h3>
    <input type="file" accept="image/*" id="fileInput1" class="hidden-input" title="Seleccionar imágenes" multiple />
    <button id="selectImageButton">📷 Seleccionar Imágenes</button>
  </div>

  <!-- Paso 2: Enviar por correo -->
  <div class="step hidden" id="emailStep">
    <h3>Paso 2: Enviar por correo</h3>
    <a id="emailLink" href="#" class="email-link" target="_blank">📧 Enviar PDF por correo</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const numerodeproyecto = params.get("NUMERODEPROYECTO")?.replace(/[-_]/g, " ");
    const precomcom = params.get("PRECOMCOM")?.replace(/[-_]/g, " ");
    const subsistema = params.get("SUBSISTEMA")?.replace(/[-_]/g, " ");
    const disciplina = params.get("DISCIPLINA")?.replace(/[-_]/g, " ");
    const nombrearchivoescaneado = params.get("NOMBREARCHIVOESCANEADO")?.replace(/[-_]/g, " ");

    document.getElementById("info").innerText = 
      `Proyecto: ${numerodeproyecto}, Precom/Com: ${precomcom}, Subsistema: ${subsistema}, Disciplina: ${disciplina}, Archivo: ${nombrearchivoescaneado}`;

    // Botón para seleccionar imágenes
    document.getElementById("selectImageButton").addEventListener("click", () => {
      document.getElementById("fileInput1").click();
    });

    document.getElementById("fileInput1").addEventListener("change", async function () {
      const files = Array.from(this.files);
      if (files.length === 0) return;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

      for (const [index, file] of files.entries()) {
        const reader = new FileReader();
        reader.onload = async function () {
          const imgData = reader.result;
          const img = new Image();

          img.onload = function () {
            let imgWidth = img.width;
            let imgHeight = img.height;

            // NO rotar la imagen, solo ajustar tamaño
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const ratio = Math.min(pageWidth / imgWidth, pageHeight / imgHeight);

            const imgX = (pageWidth - imgWidth * ratio) / 2;
            const imgY = (pageHeight - imgHeight * ratio) / 2;

            pdf.addImage(img, 'JPEG', imgX, imgY, imgWidth * ratio, imgHeight * ratio);

            // Agregar una nueva página si no es la última imagen
            if (index < files.length - 1) {
              pdf.addPage();
            }

            // Descargar PDF al finalizar la última imagen
            if (index === files.length - 1) {
              const pdfBlob = pdf.output("blob");
             const fileName = `${nombrearchivoescaneado}.pdf`;

              // Descargar PDF
              const url = URL.createObjectURL(pdfBlob);
              const a = document.createElement("a");
              a.href = url;
              a.download = fileName;
              a.click();
              URL.revokeObjectURL(url);

              // Mostrar link de mail
              const subjectText = `NUMERODEPROYECTO=${numerodeproyecto};PRECOMCOM=${precomcom};SUBSISTEMA=${subsistema};DISCIPLINA=${disciplina};NOMBREARCHIVOESCANEADO=${nombrearchivoescaneado}`;
              const bodyText = `Adjunte el archivo PDF descargado automáticamente.\n\nGracias.`;
              const emailLink = document.getElementById("emailLink");
              emailLink.href = `mailto:sistematizacion@sparkgy.com?subject=${encodeURIComponent(subjectText)}&body=${encodeURIComponent(bodyText)}`;
              emailLink.style.display = "block";

              // Mostrar paso 2
              document.getElementById("emailStep").style.display = "block";
            }
          };
          img.src = imgData;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
